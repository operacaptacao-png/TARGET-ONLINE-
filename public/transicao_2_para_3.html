<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey to Lesson 3</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Paleta Fria (Dark Blue) para a Lição 3 */
            --blue-dark: #0f172a;
            --blue-medium: #1e3a8a;
            --blue-light: #3b82f6;
            --font-main: 'Montserrat', sans-serif;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--blue-dark); font-family: var(--font-main);
            overflow: hidden;
        }

        /* ==== FUNDO CHUVOSO ==== */
        .rainy-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            /* Imagem de Londres ou cidade fria/chuvosa */
            background-image: url('https://images.unsplash.com/photo-1513622470522-26c308a201f8?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center;
            /* Filtro Azul Escuro por cima da imagem */
            box-shadow: inset 0 0 0 2000px rgba(15, 23, 42, 0.75); 
            z-index: 1; transition: opacity 2s;
        }

        /* ==== EFEITO DE CHUVA ==== */
        #rain-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; pointer-events: none; overflow: hidden;
        }

        .drop {
            position: absolute;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.4));
            width: 2px;
            height: 80px;
            bottom: 100%;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(0) scaleY(1); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(120vh) scaleY(0.5); opacity: 0; }
        }

        /* ==== CONTAINER DOS TEXTOS E ANIMAÇÕES ==== */
        .cinematic-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; text-align: center; padding: 20px; box-sizing: border-box;
        }

        .narrative-text {
            font-size: 42px; font-weight: 300; color: white; text-shadow: 0 4px 15px rgba(0,0,0,0.9);
            opacity: 0; transform: scale(0.95); transition: all 1.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: absolute; width: 90%; max-width: 800px;
        }
        .narrative-text.show { opacity: 1; transform: scale(1); }

        /* ==== LETREIRO GIGANTE (LESSON 3) ==== */
        .title-container {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; transform: scale(0.8); transition: all 2s cubic-bezier(0.25, 0.8, 0.25, 1);
            pointer-events: none; position: absolute; width: 100%;
        }
        .title-container.show { opacity: 1; transform: scale(1); pointer-events: auto; }

        .main-title {
            font-size: 7vw; font-weight: 900; color: var(--blue-light);
            text-transform: uppercase; letter-spacing: 10px; margin: 0;
            text-shadow: 0 10px 30px rgba(0,0,0,0.9); line-height: 1.1;
        }
        .sub-title {
            font-size: 3.5vw; font-weight: 300; color: white;
            text-transform: uppercase; letter-spacing: 12px; margin: 10px 0 40px 0;
            text-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }
        .lesson-badge {
            background: var(--blue-medium); color: white; font-size: 22px; font-weight: 700;
            padding: 12px 35px; border-radius: 50px; letter-spacing: 4px; text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6); margin-bottom: 20px;
        }

        /* Botões */
        .btn-start {
            background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.5); color: white;
            padding: 18px 50px; font-family: var(--font-main); font-weight: 700; font-size: 20px;
            border-radius: 50px; cursor: pointer; transition: 0.3s; backdrop-filter: blur(8px);
            text-transform: uppercase; letter-spacing: 2px;
        }
        .btn-start:hover { background: white; color: var(--blue-dark); transform: scale(1.05); box-shadow: 0 10px 25px rgba(0,0,0,0.6); }

        .btn-proceed {
            background: var(--blue-light); color: white; border: none;
            padding: 20px 60px; font-family: var(--font-main); font-weight: 900; font-size: 22px;
            border-radius: 50px; cursor: pointer; transition: 0.3s; margin-top: 30px;
            text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 15px 30px rgba(0,0,0,0.8);
        }
        .btn-proceed:hover { background: #2563eb; transform: translateY(-5px); }

        @media (max-width: 768px) {
            .main-title { font-size: 10vw; }
            .sub-title { font-size: 5vw; }
            .narrative-text { font-size: 28px; }
        }
    </style>
</head>
<body>

    <!-- Fundo Azul Escuro / Frio -->
    <div class="rainy-bg"></div>

    <!-- Áudio de Chuva -->
    <audio id="bg-audio" loop>
        <source src="rain_ambient.mp3" type="audio/mpeg">
    </audio>

    <!-- Container das Gotas de Chuva -->
    <div id="rain-container"></div>

    <div class="cinematic-container">
        
        <!-- Ecrã Inicial para liberar o Áudio -->
        <div id="intro-screen" style="z-index: 20;">
            <button class="btn-start" onclick="startCinematic()">Next Day ➔</button>
        </div>

        <!-- Textos Narrativos -->
        <div id="text-1" class="narrative-text">It wasn't this cold in Brazil...</div>
        <div id="text-2" class="narrative-text">I think I need some new clothes.</div>

        <!-- Letreiro Gigante Final -->
        <div id="final-title" class="title-container">
            <div class="lesson-badge">Lesson - 3</div>
            <h1 class="main-title">AT THE CLOTHES SHOP</h1>
            <h2 class="sub-title">Shopping for clothes</h2>
            
            <button class="btn-proceed" onclick="window.location.href='licao3a.html'">Enter Shop ➔</button>
        </div>

    </div>

    <script>
        // Função para criar o efeito de chuva dinâmica
        function createRain() {
            const container = document.getElementById('rain-container');
            const numDrops = window.innerWidth < 768 ? 50 : 150;
            
            for(let i = 0; i < numDrops; i++) {
                let drop = document.createElement('div');
                drop.className = 'drop';
                drop.style.left = Math.random() * 100 + 'vw';
                let duration = Math.random() * 1 + 0.5;
                drop.style.animationDuration = duration + 's';
                drop.style.animationDelay = Math.random() * 2 + 's';
                drop.style.opacity = Math.random() * 0.5 + 0.2;
                container.appendChild(drop);
            }
        }

        async function startCinematic() {
            document.getElementById('intro-screen').style.display = 'none';
            try { 
                let audio = document.getElementById('bg-audio');
                audio.volume = 0.6;
                audio.play(); 
            } catch(e) { console.log("Áudio não encontrado ou bloqueado."); }

            createRain();

            const texts = ['text-1', 'text-2'];
            for (let i = 0; i < texts.length; i++) {
                let el = document.getElementById(texts[i]);
                el.classList.add('show');
                await new Promise(r => setTimeout(r, 2500));
                el.classList.remove('show');
                await new Promise(r => setTimeout(r, 800));
            }

            await new Promise(r => setTimeout(r, 400));
            document.getElementById('final-title').classList.add('show');
        }
    </script>
</body>
</html>
